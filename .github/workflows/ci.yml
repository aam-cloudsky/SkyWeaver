name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Reed (aam-cloudsky/Reed) is a public dependency pinned to the tag
      # v2.0.0 in pyproject.toml; pip installs it with no credentials.
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile Python sources
        run: python -m compileall -q src tests tools

      - name: Check that the reference scenes are deterministic
        run: python tools/record_reference_scenes.py --check-determinism

      - name: Run tests
        run: python -m pytest

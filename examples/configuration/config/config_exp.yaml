sources:

  infrastructure_layers:

    - name: rio_heliports
      category: infrastructure
      type: heliport

      supported_vehicle_types:
        - mav

      path: "./data/heliports.geojson"

    - name: rio_droneports
      category: infrastructure
      type: droneport

      supported_vehicle_types:
        - uav

      path: "./data/mega_shoppings.geojson"

domain:
  padding: 1000.0
  margin: 2000.0
  # projection: "AEQD"  # Azimuthal Equidistant Projection

hexgrid:
  cell_size: 500.0
  orientation: "POINTY" #no other options for now, but could be "flat" in the future